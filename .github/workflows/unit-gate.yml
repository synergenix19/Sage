name: unit-gate

# Deterministic safety-surface coverage. ferry-gate only covers server.py/state.py/
# skill_ids.py plumbing; this gate covers the routing/skill-selection/executor/composer
# surfaces (graph.py, nodes/, prompts/, rules/, skills/) that the ferry filter misses.
# It runs every suite tagged @pytest.mark.safety_gate that is deterministic (no real
# LLM/DB calls — the LLM is mocked or unused) and currently green, so the gate means
# something. The whole not-slow suite is NOT runnable here: dozens of tests depend on a
# live OpenRouter/DB (e.g. test_language, test_wrong_skill_routing) and would be red in CI.
#
# MARKER-SELECTED (K1.3, 2026-08-19 keystones stream; owner-approved, stacked on #532/#510/
# #515): selection used to be a hand-maintained CANDIDATES path list, existence-filtered per
# branch. That approach could not fail loud when a suite was silently dropped from the list
# (K1.4's fatal floor exists because of it) and required editing this workflow file to add
# every new gated test file. Selection is now by marker: a test opts into the gate by
# carrying `pytestmark = pytest.mark.safety_gate` (module level; append to an existing list
# where one exists), not by a line in this file. New deterministic safety suites should be
# tagged with the marker at the point they're written; see #532 for the K1.5 adjudication
# batch that tagged the last hand-picked backlog before this switch, and each CANDIDATES-era
# PR (referenced in prior git history of this file) for the per-suite rationale that used to
# live here — that provenance is preserved in git blame/PR bodies, not duplicated in this file.

on:
  push:
    branches: [master]
    paths:
      - 'src/sage_poc/**'
      - 'tests/**'
      - 'pyproject.toml'
      # Corpus is content-as-code: auto-sync ingests it to the prod clinical surface
      # on deploy, so a malformed/mistagged/clinically-wrong chunk must be gated like
      # code. Pairs with test_corpus_integrity.py (safety_gate-marked).
      - 'data/knowledge_corpus/**'
      # Psychoed content is the same content-as-code class as the knowledge corpus above
      # (clinician-editable trigger phrases/blocks/collision table that drive a clinical
      # serving surface): a PR editing ONLY data/psychoed/** must be gated like code.
      # Pairs with test_psychoed_content_integrity.py (safety_gate-marked; final review
      # Important 1/2, 2026-08-05).
      - 'data/psychoed/**'
      # Flags are config-as-code (2026-07-29 signed-flag gate): a PR editing ONLY
      # config/prod_flags.yaml is exactly the PR the signed-value check exists for, so
      # it must trigger the gate (test_prod_flags_register.py). scripts/ is likewise a
      # tested surface now (helper-only grep, apply/watchdog logic, prod_smoke guard).
      - 'config/**'
      - 'scripts/**'
      # K1.4 fix round 1 (M-3): the gate DEFINITION itself is now a gate-relevant path — a PR
      # that only edits the marker expression, the floor check, or the floor value must always
      # run the gate (including the floor step), never take the docs-only fast pass. Pairs with
      # the matching addition to the "Detect safety-surface changes" regex below.
      - '.github/workflows/unit-gate.yml'
      - '.github/gate_floor.txt'
  # Runs on EVERY PR (no path filter) so the required "Safety-surface unit tests" check
  # ALWAYS reports. A path-filtered REQUIRED check never reports on a docs-only PR, and
  # strict branch protection would then deadlock that PR's merge forever (9 open docs/
  # scripts PRs hit exactly this when the check was first made required, 2026-07-10). The
  # job self-gates: it runs the heavy suite only when safety-surface code paths changed
  # (see the "Detect" step) and reports a fast pass otherwise — guard-job pattern, closes
  # ticket 2026-06-24-ci-hard-gate-without-deadlock.md.
  pull_request:

jobs:
  unit:
    name: Safety-surface unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base history to diff which paths changed

      # Guard: does this PR touch the safety-surface paths the heavy suite protects?
      # If not (docs/.github-only), skip install+pytest but STILL succeed, so the
      # required check reports green and the PR is not deadlocked. If yes, run the full gate.
      - name: Detect safety-surface changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          else
            CHANGED=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" 2>/dev/null || echo "src/sage_poc/_forcerun")
          fi
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/sage_poc/|tests/|data/knowledge_corpus/|data/psychoed/|config/|scripts/)|^pyproject\.toml$|^\.github/(workflows/unit-gate\.yml|gate_floor\.txt)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=unit-gate guard::No safety-surface code paths changed; reporting pass without running the suite (prevents required-check deadlock on docs-only PRs)."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.code == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.code == 'true'
        run: pip install -e ".[dev]"

      - name: Static — SageState channel contract (no undeclared node->node channels)
        # Fails the build if any key written by a node and read by another is not a declared
        # SageState channel — LangGraph silently drops undeclared keys (the SG-2 node->node seam,
        # 4th instance of the "components green, seam broken" class). Structural enforcement so
        # this failure mode is impossible, not merely tested.
        if: steps.detect.outputs.code == 'true'
        run: python scripts/check_state_channels.py

      - name: Static — env-flag enumeration (parity stamps see every call-time flag)
        # Fails the build if a SAGE_*/SKILL_* env flag is read outside config.py without being
        # enumerated in sage_poc.env_flags (the "V2-off locals false-passed" instrument-defect
        # class, 3rd recurrence — code_review.md P2 class closure, owner-required).
        if: steps.detect.outputs.code == 'true'
        run: python scripts/check_env_flag_enumeration.py

      - name: Static — safety trigger-file language parity (no EN-only safety lists)
        # Fails the build if a safety trigger file carries English triggers but no Arabic coverage
        # (bilingual product). Root class of #329 (a live AR medical red-flag bypass) and #330.
        # EXEMPT entries carry a tracking ticket, so debt stays visible while the gate stays green —
        # the never-disarm principle with a workable escape valve.
        if: steps.detect.outputs.code == 'true'
        run: python scripts/check_safety_language_parity.py
      - name: Static — safety detectors read RAW input (language contract)
        # Fails the build if a safety detector call passes translated message_en without raw. Root
        # class of #329/#330 (AR safety bypasses via the translation path). ADR 2026-07-16. Allowlist
        # entries carry tickets (EXEMPT pattern) so transitional debt stays visible, not silent.
        if: steps.detect.outputs.code == 'true'
        run: python scripts/check_safety_reads_raw.py
      - name: Static — safety disposition-ownership (no un-reconciled overlap)
        # Fails if two safety mechanisms' match sets overlap into DIFFERENT dispositions without a declared
        # owner in disposition_ownership.json. Third refusal-property; born from the 2026-07-28 §1c conflict
        # (CF-010 referral vs panic_override ground on the same utterance, both clinician-signed).
        if: steps.detect.outputs.code == 'true'
        run: python scripts/check_disposition_ownership.py

      - name: Collection floor — the gate can no longer silently shrink
        # K1.4 fatal miss (2026-08-19). Parses the collected count from the SAME expression +
        # SAME explicit path roots the run step below uses, and fails HARD (not the old
        # ::warning) below the floor or on any collection error — a missing/shrunk gated suite
        # is a red gate now, never a silent pass. This is the fix for the exact failure mode
        # Exhibit A in the K1.5 adjudication packet documents: an ungated pin (byte-identical
        # snapshot, PR #527) sat silently red on master for five weeks because nothing watched
        # it. A collection-count floor is watched on every run, by construction.
        #
        # FLOOR GOVERNANCE (Amendment 2, verbatim from the plan): the floor is a MINIMUM —
        # additions never trip it. Therefore any PR that LOWERS .github/gate_floor.txt is by
        # definition removing gated safety tests and is OWNER-GATED, no exceptions. A red gate
        # is never "fixed" by adjusting the floor downward; the floor moves down only with an
        # owner-signed removal decision recorded in the PR body. Raising the floor accompanies
        # any PR that adds gated tests (one-line file change, reviewable).
        if: steps.detect.outputs.code == 'true'
        env:
          OPENROUTER_API_KEY: dummy-ci
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # See the run step below for why this is required (scripts/prod_smoke/tests is now a
          # directory path root; its collection-time import chain fail-closes on this being unset).
          SAGE_API_KEY: dummy-ci
        run: |
          set -euo pipefail
          COLLECT_OUT=$(pytest tests scripts/prod_smoke/tests \
            -m "safety_gate and not integration and not clinical_decision_pending and not governance and not cradle and not slow" \
            -p no:randomly --collect-only -q 2>&1) || {
            echo "$COLLECT_OUT"
            echo "::error title=unit-gate floor::Collection FAILED (pytest exited non-zero) — treated as a red gate, not a warning. A collection error can hide an arbitrary number of dropped tests, so this is fatal regardless of the floor value."
            exit 1
          }
          echo "$COLLECT_OUT"
          N=$(echo "$COLLECT_OUT" | grep -oE '^[0-9]+' | tail -1)
          # The summary line is either "N tests collected" or "N/M tests collected (K deselected)"
          # depending on whether any deselection occurred; both start with the same leading integer.
          FLOOR=$(cat .github/gate_floor.txt)
          if [ -z "$N" ]; then
            echo "::error title=unit-gate floor::Could not parse a collected count from pytest's collection summary — treated as a red gate, not a warning."
            exit 1
          fi
          echo "Collected: $N   Floor: $FLOOR"
          if [ "$N" -lt "$FLOOR" ]; then
            echo "::error title=unit-gate floor::Collected count ($N) is BELOW the floor ($FLOOR) recorded in .github/gate_floor.txt. A gated safety suite silently shrank, was deselected, or dropped out. This is FATAL — the floor is a MINIMUM and this run is red. If gated tests were deliberately and legitimately removed, the PR that removes them lowers gate_floor.txt explicitly in the same diff, with an owner-signed removal decision recorded in the PR body — the floor is never lowered as a side effect of making a red run pass."
            exit 1
          fi

      - name: Run safety_gate-marked deterministic suites
        if: steps.detect.outputs.code == 'true'
        env:
          # Suites mock the LLM or do not call it; a dummy key prevents import-time
          # failures in llm.py. No real network/DB is touched.
          OPENROUTER_API_KEY: dummy-ci
          # The safety gate must NEVER download BGE-M3 (~2GB) — that Hub download hung CI
          # for 30+ min (#298). Force offline so the warm-load fails FAST to the loud stub
          # (conftest _warm_bge_m3_once). Non-slow tests run on the zero-vector stub; @slow
          # tests that need real embeddings are excluded here and would fail-loud if run.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # scripts/prod_smoke/tests is now collected as a whole directory (path root, below)
          # rather than one named file, so pytest's collection phase imports every module under
          # it — including scripts/prod_smoke/run.py -> tier_a_safety.py -> cases.py ->
          # functional_test_production.py, whose fail-closed guard SystemExits if SAGE_API_KEY
          # is unset. That import-time SystemExit crashes pytest's collector with an
          # INTERNALERROR (not a normal collection error), which would abort the whole job. A
          # dummy value only needs to exist, never be valid — no real network call is made
          # during collection or by any safety_gate-marked test. Found and recorded during K1.3
          # (2026-08-19); see PR body for the reproduction.
          SAGE_API_KEY: dummy-ci
        run: |
          set -euo pipefail
          # K1.3 (2026-08-19): marker selection replaces the old CANDIDATES path-list loop.
          # EXPLICIT PATH ROOTS REQUIRED (K1.2 review finding, restated here because it is load-
          # bearing): pyproject's testpaths=["tests"] silently scopes a bare marker-only
          # invocation away from anything outside tests/ (drops the credential-guard file under
          # scripts/prod_smoke/tests) — a false "empty selection" for that file. `tests
          # scripts/prod_smoke/tests` are both given explicitly so nothing outside testpaths is
          # silently dropped.
          #
          # FULL explicit marker expression (I-2, final-review lesson): CLI `-m` OVERRIDES
          # addopts' `-m` by last-occurrence, it does not combine with it — so the expression
          # below restates every one of addopts' exclusion lanes explicitly
          # (integration/clinical_decision_pending/governance/cradle/slow) in addition to
          # `safety_gate`, rather than relying on addopts to add them implicitly.
          pytest tests scripts/prod_smoke/tests \
            -m "safety_gate and not integration and not clinical_decision_pending and not governance and not cradle and not slow" \
            -p no:randomly --tb=short
