# =====================================================================================
# prod_flags.yaml — config-as-code register for every SAGE_* prod flag (sage-api, production)
#
# THIS FILE IS THE ONLY SANCTIONED FLAG-CHANGE PATH:
#     edit this file -> PR -> merge -> scripts/apply_prod_flags.py --apply
# Direct `railway variables` edits are drift by definition; scripts/flag_watchdog.py
# alerts on them (alert-first interim; NO auto-revert per the 2026-07-29 stand-down).
#
# Why config-as-code and not a build-side deploy gate (#258 shape): all three real
# SAGE_INFO_REQUEST_CONSULT reversions (2026-07-28..29, two of them SERVED) were
# VARIABLE-ONLY changes that never triggered a build. A build gate watches them sail
# past; the enforcement surface must be the committed file + idempotent apply.
#
# Semantics of each row:
#   value:         the RAW railway env value as a STRING, or null = "not set in railway"
#                  (the config.py default then applies — strict-parse defaults for the
#                  safety kill-switches). SEEDED 2026-07-29 from the prod SERVING readback
#                  (/health/version, build 09013f19) with `railway variables --kv` for the
#                  vars the serving build's readback does not yet expose.
#   class:         safety | feature (two-class taxonomy, endorsed 2026-07-28:
#                  2026-07-28-flag-class-taxonomy-decision-request.md). "PRESUMED" rows
#                  carry the 2026-07-28 architectural ruling (screens/preempts/terminates
#                  on risk content -> safety) pending clinical sign-off.
#   signed_value:  for flags carrying a clinical/governance signature — the SIGNED state.
#                  value != signed_value WITHOUT an override block is a CI FAILURE
#                  (tests/test_prod_flags_register.py) and apply REFUSES to run.
#   signature_ref: who signed + record (required whenever signed_value is present).
#   override:      {rationale, ratification_ref} — the ONLY way a signed flag may
#                  legitimately sit off its signed value. ratification_ref is mandatory.
#   serving_verified: false = DESIRED-UNVERIFIED RIDER (2026-07-29 ruling 2). The row's
#                  value was seeded from `railway variables` (desired side) and has NEVER
#                  been confirmed by a serving readback — the deployed build predates the
#                  #386 readback widening. Any artifact, register row, or decision citing
#                  such a flag must carry the desired-unverified caveat. The rider
#                  DISSOLVES PER-VAR by DELETING the key once a deploy serves the widened
#                  readback and the watchdog confirms coverage (its readback_gaps output
#                  is the live source of truth). The key may never be set to true: the
#                  register never asserts serving state statically — that is the
#                  watchdog's job, dynamically (see tests/test_prod_flags_register.py).
#
# NOT in this file, by design: SAGE_API_KEY (secret), SAGE_BUILD_SHA (per-deploy
# provenance pin owned by deploy_prod.sh), SAGE_TEST_USER_IDS (env-specific data).
# The apply script never touches variables this file does not list.
# =====================================================================================
